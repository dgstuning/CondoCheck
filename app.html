/* painel da tela inicial: chamados por situação, piscina e prazos obrigatórios */
function painelChamados(r){
  var all=visible(),ct=function(st){return all.filter(function(t){return t.status===st}).length};
  var ab=ct('Aberto'),an=ct('Em atendimento'),pa=ct('Pausado'),
    ur=all.filter(function(t){return t.prioridade==='Urgente'&&t.status!=='Concluído'}).length;
  var meus=function(st){return isStaffExec(r)?all.filter(function(t){return t.status===st&&ownsTicket(t)}).length:0};
  var go=function(f){return function(){S.filter=f;S.tab='tickets';draw()}};
  var tile=function(ic,v,l,fn,sub,cls){return h('button',{type:'button',class:'kpi kpibtn'+(cls?' '+cls:''),onclick:fn},
    h('div',{class:'v',text:String(v)}),h('div',{class:'l',text:ic+' '+l}),sub?h('div',{class:'small',text:sub}):null)};
  var por=function(st){var n=meus(st);return isStaffExec(r)?n+' por mim':''};
  var row1=h('div',{class:'kpis'},
    tile('🆕',ab,'Abertos',go('Aberto'),'',ab?'':''),
    tile('🔧',an,'Em atendimento',go('Em atendimento'),por('Em atendimento')),
    tile('⏸️',pa,'Pausados',go('Pausado'),por('Pausado')),
    tile('🚨',ur,'Urgentes',go('todos'),ur?'em aberto':'nenhum em aberto',ur?'alerta':''));
  var cards=[];
  var dp=MODS.piscinas;
  if(dp&&canSee(dp,r)){
    var ls=col('piscinas').slice().sort(function(a,b){return String(b.data).localeCompare(String(a.data))||(b.criadoEm||0)-(a.criadoEm||0)}),u=ls[0];
    cards.push(tile('🏊',u?(poolFora(u)?'Fora do ideal':'Dentro do ideal'):'Sem leitura','Piscina',function(){S.tab='m:piscinas';draw()},
      u?(u.piscina||'')+' · '+fmtD(u.data):'Nenhuma leitura registrada',u&&poolFora(u)?'txt alerta':'txt'))}
  var dq=MODS.obrigacoes;
  if(dq&&canSee(dq,r)){
    var ob=col('obrigacoes'),dd=function(d){return daysTo(d.vencimento)},
      venc=ob.filter(function(d){var n=dd(d);return n!=null&&n<0}).length,
      prox=ob.filter(function(d){var n=dd(d);return n!=null&&n>=0&&n<=30}).length;
    cards.push(tile('🧭',venc?venc+' vencido'+(venc>1?'s':''):prox?prox+' em 30 dias':ob.length?'Em dia':'Nada cadastrado','Prazos obrigatórios',
      function(){S.tab='m:obrigacoes';draw()},ob.length+' cadastrado'+(ob.length===1?'':'s'),venc?'txt alerta':'txt'))}
  return h('div',null,row1,cards.length?h('div',{class:'kpis'},cards):null);
}
